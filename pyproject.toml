[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-game"  # distribution name (can be different from import name)
version = "0.1.0"
description = "Udacity course follow along project (poker)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "David Linkowski", email = "david.linkowski@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black",
  "flake8",
]

# --- setuptools: tell it you're using src-layout
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# --- pytest config
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that are slow / Monte-Carlo / long-running",
]
addopts = "-q"
python_files = ["test_*.py"]
