[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-of-programs"
version = "0.1.0"
description = "Udacity course follow along project (poker)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "David Linkowski", email = "david.linkowski@#gmail.com"}
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "flake8"]